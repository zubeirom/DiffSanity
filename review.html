<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DiffSanity</title>
    <link rel="icon" href="icons/icon-32.png" />
    <link rel="stylesheet" href="review.css" />
    <script src="review.js" defer></script>
  </head>
  <body>
    <header class="ds-header">
      <a id="ds-back" class="ds-back" title="Back to the pull request on GitHub">← Back to GitHub</a>
      <div class="ds-file" aria-label="File under review">
        <span id="ds-dir" class="ds-dir"></span><strong id="ds-name" class="ds-name"></strong>
        <span id="ds-renamed" class="ds-renamed" hidden></span>
        <span id="ds-status" class="ds-badge" hidden></span>
      </div>
      <div class="ds-stats">
        <span id="ds-additions" class="ds-additions"></span>
        <span id="ds-deletions" class="ds-deletions"></span>
      </div>
      <div class="ds-meta">
        <a id="ds-pr" class="ds-pr"></a>
        <span id="ds-revisions" class="ds-revisions"></span>
        <span class="ds-brand" title="DiffSanity — bring sanity back to GitHub diffs">DiffSanity</span>
      </div>
      <div id="ds-window-actions" class="ds-window-actions" hidden>
        <button id="ds-maximize" class="ds-icon-button" type="button" aria-pressed="false" aria-label="Full screen" title="Full screen">
          <svg class="ds-icon-expand" aria-hidden="true" viewBox="0 0 16 16" width="16" height="16"><path d="M1.75 10a.75.75 0 0 1 .75.75v2.5c0 .138.112.25.25.25h2.5a.75.75 0 0 1 0 1.5h-2.5A1.75 1.75 0 0 1 1 13.25v-2.5a.75.75 0 0 1 .75-.75Zm12.5 0a.75.75 0 0 1 .75.75v2.5A1.75 1.75 0 0 1 13.25 15h-2.5a.75.75 0 0 1 0-1.5h2.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 .75-.75ZM2.75 2.5a.25.25 0 0 0-.25.25v2.5a.75.75 0 0 1-1.5 0v-2.5C1 1.784 1.784 1 2.75 1h2.5a.75.75 0 0 1 0 1.5ZM10 1.75a.75.75 0 0 1 .75-.75h2.5c.966 0 1.75.784 1.75 1.75v2.5a.75.75 0 0 1-1.5 0v-2.5a.25.25 0 0 0-.25-.25h-2.5a.75.75 0 0 1-.75-.75Z"/></svg>
          <svg class="ds-icon-restore" aria-hidden="true" viewBox="0 0 16 16" width="16" height="16"><path d="M10.75 1a.75.75 0 0 1 .75.75v2.5c0 .138.112.25.25.25h2.5a.75.75 0 0 1 0 1.5h-2.5A1.75 1.75 0 0 1 10 4.25v-2.5a.75.75 0 0 1 .75-.75Zm-5.5 0a.75.75 0 0 1 .75.75v2.5A1.75 1.75 0 0 1 4.25 6h-2.5a.75.75 0 0 1 0-1.5h2.5a.25.25 0 0 0 .25-.25v-2.5A.75.75 0 0 1 5.25 1ZM1 10.75a.75.75 0 0 1 .75-.75h2.5c.966 0 1.75.784 1.75 1.75v2.5a.75.75 0 0 1-1.5 0v-2.5a.25.25 0 0 0-.25-.25h-2.5a.75.75 0 0 1-.75-.75Zm9 1c0-.966.784-1.75 1.75-1.75h2.5a.75.75 0 0 1 0 1.5h-2.5a.25.25 0 0 0-.25.25v2.5a.75.75 0 0 1-1.5 0Z"/></svg>
        </button>
        <button id="ds-new-tab" class="ds-icon-button" type="button" aria-label="Open in new tab" title="Open in new tab">
          <svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16"><path d="M3.75 2h3.5a.75.75 0 0 1 0 1.5h-3.5a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25v-3.5a.75.75 0 0 1 1.5 0v3.5A1.75 1.75 0 0 1 12.25 14h-8.5A1.75 1.75 0 0 1 2 12.25v-8.5C2 2.784 2.784 2 3.75 2Zm6.854-1h4.146a.25.25 0 0 1 .25.25v4.146a.25.25 0 0 1-.427.177L13.03 4.03 9.28 7.78a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042l3.75-3.75-1.543-1.543A.25.25 0 0 1 10.604 1Z"/></svg>
        </button>
        <button id="ds-close" class="ds-icon-button" type="button" aria-label="Close" title="Close (Esc)">
          <svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>
        </button>
      </div>
    </header>
    <div id="ds-message" class="ds-message" role="status" hidden></div>
    <main class="ds-main">
      <div id="ds-scroller" class="ds-scroller" tabindex="0" aria-label="File contents"></div>
      <div id="ds-minimap" class="ds-minimap" aria-hidden="true"></div>
    </main>
  </body>
</html>
